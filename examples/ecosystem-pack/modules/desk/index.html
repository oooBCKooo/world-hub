<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross-language text desk</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e5edf6;background:#101b2b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:36px 22px}main{max-width:1050px;margin:auto}header{display:flex;justify-content:space-between;align-items:start;gap:20px}h1{font-size:32px;margin:4px 0 8px}p{line-height:1.6;color:#aebdd0}button,select,textarea{font:inherit}button,select{border:1px solid #49617c;border-radius:9px;background:#21374f;color:#e5edf6;padding:10px 16px;cursor:pointer}button.primary{background:#5fd9b7;color:#0b2e26;font-weight:650;border-color:#5fd9b7}button:disabled{opacity:.5;cursor:wait}.path{padding:16px 20px;margin:20px 0;border:1px solid #344c68;border-radius:12px;background:#14273c;font-size:14px;color:#b8d9f1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{padding:24px;border:1px solid #344c68;border-radius:16px;background:#17283e}h2{margin:0 0 16px;font-size:18px}textarea{display:block;width:100%;min-height:235px;resize:vertical;background:#0d1b2b;color:#e5edf6;border:1px solid #49617c;border-radius:10px;padding:15px;line-height:1.6}textarea:focus,button:focus,select:focus{outline:2px solid #5fd9b7;outline-offset:3px}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.status{font-size:14px;min-height:24px;margin-top:18px;color:#b8d9f1}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#0d1b2b;border-radius:10px;padding:16px 8px;text-align:center}.metric strong{font-size:28px;display:block}.metric small{color:#aebdd0}.hash{overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;color:#aebdd0;margin-top:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;color:#b8d9f1}details{margin-top:20px}summary{cursor:pointer}footer{font-size:13px;margin-top:20px;color:#aebdd0}@media(max-width:760px){body{padding:22px 14px}.grid{grid-template-columns:1fr}h1{font-size:25px}section{padding:18px}.metrics strong{font-size:24px}}
</style><script src="/ui.js" defer></script></head><body><main>
<header><div><h1 data-i18n="title">跨语言文本台</h1><p data-i18n="subtitle">三个独立程序，通过双向 mod 桥组合。</p></div><label><span class="language-label" data-i18n="language">语言</span> <select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></label></header>
<div class="path" data-i18n="path">界面程序 → 枢纽 → JavaScript 来源 → 枢纽 → 界面程序 → 枢纽 → Python 统计 → 枢纽 → 界面程序</div>
<div class="grid"><section><h2 data-i18n="input">文本来源</h2><label for="text" data-i18n="inputHint">保留原文、emoji 和换行，最多 16 KiB UTF-8。</label><textarea id="text" spellcheck="false">你好，世界 🌍
Hello World Hub
</textarea><div class="buttons"><button class="primary" id="analyze" data-i18n="analyze">保存来源并分析</button><button id="read" data-i18n="read">分析已保存来源</button></div><div id="status" class="status" role="status" aria-live="polite"></div></section>
<section><h2 data-i18n="result">Python 统计成果</h2><div class="metrics"><div class="metric"><strong id="points">—</strong><small data-i18n="points">Unicode 码点</small></div><div class="metric"><strong id="lines">—</strong><small data-i18n="lines">行数</small></div><div class="metric"><strong id="bytes">—</strong><small data-i18n="bytes">UTF-8 字节</small></div></div><div class="hash" id="hash"></div><p id="saved"></p><details><summary data-i18n="receipts">查看真实通讯回执</summary><pre id="receipts"></pre></details></section></div>
<footer data-i18n="footer">原文和成果由外部程序保存。枢纽只接纳、保留和转交通讯；ACK 和停止不会释放记录。</footer>
</main></body></html>
