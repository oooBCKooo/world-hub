<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>World Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2314b8a6' d='M16 2 30 16 16 30 2 16z'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230f172a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body id="single-hub-app" class="single-hub-app">
  <a class="skip-link" href="#main">跳至内容 / Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="World Hub">
      <div class="brand-row"><a class="brand" href="#programs"><span class="brand-mark" aria-hidden="true"><span></span></span><span>World Hub<small id="workspace-label"></small></span></a><button id="refresh" class="icon-button" type="button" aria-label="刷新 / Refresh">↻</button></div>
      <button id="sidebar-menu-toggle" class="button sidebar-menu-toggle" type="button" aria-controls="navigation" aria-expanded="false">☰ <span>导航 / Navigation</span></button>
      <nav id="navigation" class="sh-navigation" aria-label="主导航 / Main navigation"></nav>
      <div class="sidebar-bottom"><div class="local-indicator"><span class="status-dot"></span><span id="connection-state"></span></div><p id="local-description"></p><div class="sidebar-controls"><select id="language" aria-label="语言 / Language"><option value="zh">简体中文</option><option value="en">English</option></select><button id="theme" class="icon-button" type="button" aria-label="主题 / Theme">☼</button></div><div class="version"><span>WORLD HUB</span><span id="version">LOCAL</span></div></div>
    </aside>
    <div class="content-shell"><header class="topbar"><div class="breadcrumb"><span>World Hub</span><span class="slash">/</span><span id="breadcrumb"></span></div><div id="topbar-stats" class="topbar-stats stats-grid" aria-label="工作区实时统计"></div><div class="topbar-actions"><button id="tasks" class="button button-quiet" type="button"></button></div></header><main id="main" tabindex="-1"><div id="connection-notice" class="notice notice-error" role="alert" hidden></div><section id="hub-bar" class="sh-hub-bar" aria-live="polite"></section><div id="view-content"></div></main></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
