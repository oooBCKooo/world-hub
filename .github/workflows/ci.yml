name: Verify repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tracked repository sources and references
        run: npm run check:repository
      - name: Node-only conformance and independent-program scenarios
        run: npm test
      - name: Purpose demos and demo distribution
        run: npm run test:demos
      - name: npm CLI and isolated package installation
        run: npm run test:npm
      - name: Build source distribution
        run: npm run build -- --output .artifacts/packages/world-hub-source

  cross-language:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the Python bridge dependency
        run: python -m pip install -r sdk/python/requirements.txt
      - name: Cross-language scenarios and adapter acceptance
        run: npm run test:cross-language

  ecosystem-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'
      - name: Install the declared Python dependency for the optional reference pack
        run: python -m pip install -r sdk/python/requirements.txt
      - name: External Runtime and source-pack integration acceptance
        run: npm run test:ecosystem
      - name: Unified local Launcher and real cross-language pack acceptance
        run: npm run test:launcher
